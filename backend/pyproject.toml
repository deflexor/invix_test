[project]
name = "catalog-backend"
version = "0.1.0"
description = "FastAPI backend and Telegram bot for the product catalog"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15",
    "aiohttp-socks>=0.9",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "minio>=7.2",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
]
# RUF001/002/003 flag Cyrillic letters that look like Latin ones;
# user-facing strings of this project are in Russian on purpose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# asyncpg ships annotations without a py.typed marker.
module = "asyncpg"
ignore_missing_imports = true
